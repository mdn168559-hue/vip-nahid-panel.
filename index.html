<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>VIP NAHID PANEL</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090909;
  color: white;
}
.container {
  max-width: 480px;
  margin: auto;
  padding: 25px 18px;
}
.header {
  text-align: center;
  padding: 35px 10px;
}
.header h1 {
  color: #f5c542;
  font-size: 38px;
  letter-spacing: 3px;
}
.header p {
  color: #c5a34b;
  letter-spacing: 3px;
}
.card {
  background: #17140e;
  border: 1px solid #9b7525;
  border-radius: 18px;
  padding: 24px;
}
h2 {
  color: #f5c542;
}
label {
  display: block;
  margin: 15px 0 7px;
}
input {
  width: 100%;
  padding: 14px;
  border-radius: 9px;
  border: 1px solid #765c27;
  background: #080808;
  color: white;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: none;
  border-radius: 9px;
  background: linear-gradient(120deg,#ffe18a,#bd861d);
  color: #171006;
  font-weight: bold;
  cursor: pointer;
}
.tabs {
  display: flex;
  gap: 10px;
}
.tabs button {
  margin-top: 0;
}
.tabs button.active {
  background: #f5c542;
}
.hidden {
  display: none;
}
.message {
  color: #f5c542;
  margin-top: 15px;
  font-size: 13px;
}
.footer {
  text-align: center;
  color: #a18a54;
  margin-top: 25px;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

<header class="header">
  <div style="font-size:45px">👑</div>
  <h1>VIP NAHID</h1>
  <p>PREMIUM CONTROL PANEL</p>
</header>

<div class="card" id="auth">
  <div class="tabs">
    <button class="active" id="loginTab"
      onclick="showTab('login')">LOGIN</button>
    <button id="registerTab"
      onclick="showTab('register')">REGISTER</button>
  </div>

  <section id="login">
    <h2>Welcome Back</h2>

    <label>Mobile Number</label>
    <input type="tel" id="loginPhone"
      placeholder="+8801XXXXXXXXX">

    <label>Password</label>
    <input type="password" id="loginPassword"
      placeholder="Enter password">

    <button onclick="login()">LOGIN TO PANEL</button>
  </section>

  <section id="register" class="hidden">
    <h2>Create Account</h2>

    <label>Full Name</label>
    <input type="text" id="name"
      placeholder="Your name">

    <label>Mobile Number</label>
    <input type="tel" id="phone"
      placeholder="+8801XXXXXXXXX">

    <label>Password</label>
    <input type="password" id="password"
      placeholder="Create password">

    <button onclick="register()">CREATE ACCOUNT</button>
  </section>

  <p id="message" class="message"></p>
</div>

<div class="card hidden" id="dashboard">
  <h2>👑 VIP NAHID DASHBOARD</h2>
  <p>Welcome, <span id="userName">VIP Member</span>!</p>
  <p>Membership: VIP MEMBER</p>
  <p>Account: Demo Preview</p>
  <button onclick="logout()">LOG OUT</button>
</div>

<div class="footer">
  VIP NAHID © 2026
</div>

</div>

<script>
function showTab(tab) {
  document.getElementById("login").classList.toggle(
    "hidden", tab !== "login"
  );
  document.getElementById("register").classList.toggle(
    "hidden", tab !== "register"
  );
  document.getElementById("loginTab").classList.toggle(
    "active", tab === "login"
  );
  document.getElementById("registerTab").classList.toggle(
    "active", tab === "register"
  );
  document.getElementById("message").textContent = "";
}

function register() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;

  if (!name || !phone || password.length < 6) {
    document.getElementById("message").textContent =
      "Enter your details and a password of at least 6 characters.";
    return;
  }

  document.getElementById("message").textContent =
    "Demo only: connect a secure authentication backend to create accounts.";
}

function login() {
  document.getElementById("message").textContent =
    "Demo only: real phone login requires a secure authentication backend.";
}

function logout() {
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("auth").classList.remove("hidden");
  showTab("login");
}
</script>

</body>
  </html>
